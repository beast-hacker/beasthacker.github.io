<!doctype html>

<html>

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Elixir — Hello World Loop — Beast Hacker</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css">
    </head>

    <body>
        <h1>Elixir</h1>

        <p>Write a "Hello, World!" program in Elixir with:
            <br> &nbsp;&nbsp;&nbsp;&nbsp;
            <code>IO.puts("Hello, World!")</code>
        </p>

        <p>When you're ready to move on, say <code>Hello, Python!</code></p>

        <div>
            <textarea id="terminal"></textarea>
            <button id="runButton">Run</button>
            <br>
            <br>
            <div id="output"></div>   
        </div>

        <script>
            const terminal = document.getElementById("terminal")

            const runButton = document.getElementById("runButton")

            const output = document.getElementById("output")

            runButton.addEventListener("click", function() {
                if (terminal.value === 'IO.puts("Hello, World!")') {
                    output.textContent = "Hello, World!"
                }
                else if (terminal.value === 'IO.puts("Hello, Python!")') {
                    window.location.href = "python.html"
                }
                else {
                    output.textContent = "Try again"
                }
            })
        </script>
    </body>
</html>
